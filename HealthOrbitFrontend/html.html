<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Health Orbit</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <div class="form-box">
        <h1>Health Orbit</h1>
        <p>Earthquake Damage Detector</p>

        <div class="toggle-buttons">
            <button type="button" onclick="showLogin()">Sign In</button>
            <button type="button" onclick="showRegister()">Register</button>
        </div>

        <form id="user-form" >
            <input type="text" id="username" placeholder="Username" class="input-field" required />
            <input type="email" id="email" placeholder="E-mail" class="input-field" />
            <input type="password" id="password" placeholder="Password" class="input-field" required />
            <input type="text" id="region" placeholder="Region" class="input-field" required />

            <button  class="submit-btn" id="submit-btn" onclick="gotosecond()">Submit</button>
        </form>
    </div>
</div>


<script>
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submit-btn');

    let currentMode = "register";

    function gotosecond() {
        window.location.href = 'second.html';
    }

    function showLogin() {
        submitBtn.textContent = 'Sign In';
        currentMode = "login";
    }

    function showRegister() {
        submitBtn.textContent = 'Register';
        currentMode = "register";
    }

    window.onload = showRegister;

    document.getElementById('user-form').addEventListener('submit', function(e) {
        e.preventDefault();

        if (currentMode === "register") {
            gotosecond();
        } else {
            gotosecond();
        }
    });
</script>

</body>
</html>
